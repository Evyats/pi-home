name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-branch
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate dashboard files
        run: |
          test -f site/index.html
          test -f site/home.css
          test -f site/home.js
          test -f site/manifest.webmanifest
          test -f site/sw.js
          test -f deploy/nginx/pi-server
          test -f deploy/status/collect_status.py
          test -f deploy/systemd/pi-home-status.service
          test -f deploy/systemd/pi-home-status.timer
          node --check site/home.js
          node --check site/sw.js
          python3 -m py_compile deploy/status/collect_status.py
          bash -n deploy.sh deploy/update/check-update.sh

      - name: Publish deploy branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/deploy; then
            git switch --create deploy --track origin/deploy
            git merge --no-edit "${SOURCE_SHA}"
          else
            git switch --force-create deploy "${SOURCE_SHA}"
          fi
          git push --set-upstream origin deploy
