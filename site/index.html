<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/home.css" />
    <title>Pi Home</title>
  </head>
  <body>
    <main>
      <section id="home-screen">
        <header>
          <div>
            <p class="eyebrow">PRIVATE HOME SERVER</p>
            <h1>Good to see you.</h1>
            <p class="intro">Choose an app and get to it.</p>
          </div>
          <button class="icon-button" id="open-settings" type="button" aria-label="Manage apps" title="Manage apps">&#9881;</button>
        </header>
        <nav id="app-menu" aria-label="Applications"></nav>
        <p class="empty-message" id="empty-menu" hidden>No apps are visible. Choose some in Manage apps.</p>
      </section>

      <section id="settings-screen" hidden>
        <header>
          <div>
            <p class="eyebrow">PI HOME</p>
            <h1>Manage apps</h1>
            <p class="intro">Choose what appears and in which order.</p>
          </div>
          <button class="icon-button" id="close-settings" type="button" aria-label="Back to home" title="Back to home">&#8592;</button>
        </header>

        <section class="app-section" aria-labelledby="visible-title">
          <h2 id="visible-title">Visible apps</h2>
          <div class="manage-list" id="visible-apps"></div>
          <p class="section-empty" id="visible-empty" hidden>No visible apps.</p>
        </section>

        <section class="app-section" aria-labelledby="hidden-title">
          <h2 id="hidden-title">Hidden apps</h2>
          <div class="manage-list" id="hidden-apps"></div>
          <p class="section-empty" id="hidden-empty" hidden>No hidden apps.</p>
        </section>
      </section>
    </main>
    <script src="/home.js"></script>
  </body>
</html>
